[project]
name = "govee-claude"
version = "0.1.0"
description = "Govee bulb status indicator for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests using real sockets/subprocesses",
]
addopts = "-m 'not integration' --basetemp=/tmp/pytest-govee"
